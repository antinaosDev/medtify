# .streamlit/secrets.toml - Template for Streamlit Cloud
# Copy these values to your Streamlit Cloud dashboard under "Secrets"

# === EVOLUTION API ===
EVOLUTION_API_URL = "http://YOUR_VPS_IP:8080"
EVOLUTION_API_KEY = "your-evolution-api-key-here"
EVOLUTION_INSTANCE = "medtify"
MEDTIFY_SAFE_MODE = "true"

